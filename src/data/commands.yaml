# The member commands of the server's YAGPDB bot, for the Commands page, in page order.
# Source: github.com/lbds137/yagpdb-custom-commands, the slash roots and the commands/<topic>/
# files whose header says `Group: Utility` (checked against the slash fleet of 2026-10-04).
# Staff tools and the commands other commands call (embed_exec, db, db_get_*, message_link,
# ...) stay off the page.
# Since 2026-10-04 the fleet is slash-first: related commands are subcommands of one root
# (/color contrast, /hebrew atbash, ...), and the retired text twins live on only as the
# root's `aliases`, so old /commands/# links keep working.
#
# A group's id is its /commands/# anchor, and so is each command's name. A command's usage
# lines start with "/<name>"; a `message: true` command fires on what a message says instead,
# so its usage lines are example messages. A context-menu command carries `invoked:` — how
# it's invoked — instead of usage lines. A grouped slash command carries `subcommands:`, one
# row per sub, and no usage or text of its own. `aliases:` lists old anchors that now land on
# the entry. src/lib/commands.ts checks all of this.
-
  name: "Glossary and rules"
  id: "glossary-and-rules"
  commands:
    - name: "define"
      usage: ["/define [term]"]
      text: >-
        Links to the term's entry in this site's [glossary](/glossary/). With no term, links to
        the whole glossary.
    - name: "rule"
      usage: ["/rule [number]"]
      text: >-
        Posts that rule from the [rules](/rules/), e.g. `/rule 5`. With no number, opens an
        interactive rulebook browser instead: one rule per page, a jump-to-rule menu, and
        paging buttons on a message that stays, so you can keep browsing. A 🗑 Dismiss under
        it closes the browser — only whoever opened it can press it.
-
  name: "Hebrew and gematria"
  id: "hebrew-and-gematria"
  commands:
    - name: "gematria"
      usage: ["/gematria <text>"]
      text: >-
        Works out the gematria of the text: the value of each word, each line and the whole,
        each reduced step by step to a single digit. It reads Hebrew, Paleo-Hebrew, Greek,
        Arabic, Latin, runes and the digits 1 to 9. When its letters correspond to 11 or fewer
        different Major Arcana, it lists those cards too, in both the Rider-Waite-Smith and
        Thoth decks.
    - name: "hebrew"
      aliases: ["atbash", "alefbet", "pyramid", "rand_hebrew"]
      subcommands:
        - name: "atbash"
          usage: ["/hebrew atbash <text>"]
          text: >-
            Enciphers the text with the atbash cipher, which swaps each letter for its mirror in
            the alphabet (the first for the last, and so on), then shows its gematria. It works on
            Hebrew, Paleo-Hebrew, Greek, Arabic, Latin, runes and digits.
        - name: "alefbet"
          usage: ["/hebrew alefbet <text>"]
          text: >-
            Turns Paleo-Hebrew or Arabic letters into their Hebrew equivalents, with final forms at
            the ends of words, then shows the gematria of the result.
        - name: "pyramid"
          usage: ["/hebrew pyramid <text>"]
          text: >-
            Builds a pyramid from each word, one more letter on every line, and shows its gematria.
            Several words give one pyramid each, up to 10.
        - name: "random"
          usage: ["/hebrew random <letters> [groups]"]
          text: >-
            Random Hebrew letters, with the gematria of the result: `/hebrew random 7` gives seven
            letters, and `/hebrew random 4 3` gives three groups of four.
-
  name: "Colors"
  id: "colors"
  commands:
    - name: "color"
      aliases: ["contrast", "contrasts", "rand_color"]
      subcommands:
        - name: "contrast"
          usage: ["/color contrast <color or role>"]
          text: >-
            Checks how readable a color is, or a role's color: its contrast against black, against
            Discord's dark theme and against white, and the average of the three.
        - name: "contrasts"
          usage: ["/color contrasts <colors or roles>"]
          text: "The same check for several colors or roles at once, up to 10."
        - name: "random"
          usage: ["/color random"]
          text: "Shows a random color: its swatch, color code and value."
        - name: "hex"
          usage: ["/color hex <color>"]
          text: "A hex code's value as a number, ready for wherever a color's integer form is wanted."
    - name: "hex_to_int"
      message: true
      usage: ["#ff0000"]
      text: >-
        Send a message that is only a color code (a `#` and six hex digits) to see a swatch
        of that color and its value as a number.
-
  name: "Links, emoji and avatars"
  id: "links-emoji-and-avatars"
  commands:
    - name: "channel_link"
      message: true
      usage: ["#channel-name"]
      text: >-
        In most channels, send a message that is only a channel mention to move the
        conversation there: the bot
        posts a link to that channel here, and a link back to this spot there. Mentioning the
        channel you're in shows its details instead.
    - name: "pointer"
      usage: ["/pointer <message link> [comment]"]
      aliases: ["message_pointer"]
      text: "Posts a link to a message on the server, with your comment if you add one."
    - name: "hugemoji"
      usage: ["/hugemoji <emoji or message links>"]
      text: >-
        Shows custom emoji at full size: give the emoji themselves, or links to messages that
        contain them, up to 10. Emoji from a message in an age-restricted channel only show in
        an age-restricted channel. Type this one as an ordinary message — Discord's slash list
        doesn't offer it.
    - name: "expand_emoji"
      invoked: "right-click a message → Apps → Expand Emoji"
      text: >-
        The right-click twin of [hugemoji](#hugemoji): shows every distinct custom emoji in
        that message at full size, in the order they appear, up to 10, each with a link back
        to the message. If the message has no custom emoji, the bot says so.
    - name: "avatar_viewer"
      usage: ["/avatar_viewer [user ID or message link] [size]"]
      text: >-
        Shows someone's avatar, with their ID, name, nickname and when their account was
        created. With no user it shows
        yours; a message link shows the avatar of whoever sent it. The size can be 32, 64,
        128, 256, 512 or 1024 (the default). Type this one as an ordinary message — Discord's
        slash list doesn't offer it.
    - name: "view_avatar"
      invoked: "right-click a user → Apps → View Avatar"
      text: >-
        The right-click twin of [avatar_viewer](#avatar_viewer): shows someone's avatar, with
        their ID, name, nickname and when their account was created, and an Open image button
        for the full-size file.
    - name: "timestamp"
      usage: ["/timestamp [ID]"]
      text: >-
        Shows when a Discord ID (a user, message, channel or role) was created. With no ID it
        shows your account's creation date.
-
  name: "Bumping"
  id: "bumping"
  commands:
    - name: "bump_check"
      message: true
      usage: ["👍"]
      text: >-
        Bumping moves the server up [Disboard](https://disboard.org/server/462036216909398026)'s
        list. In !c!disboard!c!, run Disboard's own `/bump`, then send a message with a 👍 so
        the bot records the bump. Every 12 hours, if the last bump is at least two hours old,
        the bot reminds the channel and pings !r!776211371322900521!r!.
-
  name: "Staff hiatus"
  id: "staff-hiatus"
  commands:
    - name: "unhiatus"
      usage: ["/unhiatus"]
      text: >-
        Coming back from a staff hiatus, this gives you back the staff roles you set aside —
        any that are no longer staff roles stay off. It only does something if the bot has you
        recorded as on hiatus; for anyone else there is nothing to restore.
