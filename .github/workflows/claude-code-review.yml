name: Claude Code Review

# Template from ~/Documents/dev-docs/templates/claude-review (adapted from Tzurot's).
# Needs the CLAUDE_CODE_OAUTH_TOKEN repo secret and the Claude GitHub App on the repo.
# The action skips itself on the PR that adds or changes this file (it validates
# against the default branch's copy), so that PR gets no review and a red check:
# the owner merges it with `repo-ruleset merge <repo> <PR>`, which lifts the required
# claude-review for that one merge. The automerge job below merges the owner's non-draft PRs
# once the review passes and every other check is green, and Dependabot's PRs
# (which get no review) once every other check is green.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A newer push makes the running review (and its merge) moot.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # The action rejects bot actors ("Workflow initiated by non-human actor"), so a
    # dependabot PR would only show a red check; skip it instead.
    if: github.event.pull_request.user.login != 'dependabot[bot]'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # The no-post check below only counts comments created after this instant;
      # the 2-minute back-shift absorbs runner-vs-API clock skew.
      - name: Record review start time
        id: review-start
        run: echo "ts=$(date -u -d '-2 minutes' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Use the repository's CLAUDE.md, if it has one, for guidance on style and conventions. Be constructive and helpful in your feedback.

            Report every issue you find; do not pre-filter by severity. Label severity instead and let the reader triage. Keep the review proportional to its findings (no padding), and if you write a summary or actionable-items section, it must list EVERY actionable item from the body.

            Do NOT run the project's test, lint or build commands: they are outside your tool allowlist, and CI verifies them. Assess test coverage by reading the tests.

            Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR. Post a comment even if everything looks fine; silence is indistinguishable from a failed review.

            Label every finding's severity as critical, high, medium or low. The LAST line of your comment must be exactly `VERDICT: BLOCK <HEAD SHA>` if any finding is critical, high or medium, otherwise exactly `VERDICT: PASS <HEAD SHA>`, with the full 40-character HEAD SHA given above and no other formatting. This line gates auto-merge: BLOCK stops the merge until a new push gets a passing review; low findings don't block.

          claude_args: '--model claude-opus-5-5 --allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'

      # This job is the check auto-merge waits on, so it passes only on a posted review
      # whose verdict names this run's head commit: VERDICT: PASS <sha>. The action can
      # finish green having posted nothing, and a stale PASS for an earlier commit must
      # not stand in for a review of this one.
      - name: Verify the review passed
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
          SINCE: ${{ steps.review-start.outputs.ts }}
          SHA: ${{ github.event.pull_request.head.sha }}
          COMMENTS: repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments?per_page=100
        run: |
          git fetch --quiet --depth=1 origin "$BASE"
          if ! git diff --quiet FETCH_HEAD -- .github/workflows/claude-code-review.yml; then
            echo "::error::This PR changes the review workflow, so no review ran (the action skips itself). The owner merges it with: repo-ruleset merge <repo> <PR>"
            exit 1
          fi
          # One line per claude[bot] comment: "new" or "old" (posted since this review started, or
          # not), then its LAST non-empty line, where the prompt puts the verdict. A VERDICT quoted
          # mid-comment (an @claude reply, a code block) never counts. Bold or backtick wrapping is
          # stripped.
          lasts=$(gh api "$COMMENTS" --paginate --slurp | jq -r '
            [.[][] | select(.user.login == "claude[bot]")]
            | sort_by(.created_at) | .[]
            | (if .created_at >= env.SINCE then "new" else "old" end) + " "
              + (.body | gsub("\r"; "") | split("\n") | map(select(test("\\S"))) | last // "")')
          lasts=$(tr -d '*`' <<< "$lasts")
          # A BLOCK naming this commit stands whatever comes after it, from any run: a later PASS
          # could be an @claude reply, or a re-run rolling the dice on the same commit.
          if grep -Eq "^(new|old) VERDICT: BLOCK $SHA[[:space:]]*\$" <<< "$lasts"; then
            echo "::error::A review of $SHA found critical, high or medium issues. Fix them and push; the new review decides."; exit 1
          elif ! grep -q '^new ' <<< "$lasts"; then
            echo "::error::claude-review completed without posting a comment (no claude[bot] comment since $SINCE). Re-run this job."; exit 1
          elif grep -Eq "^new VERDICT: PASS $SHA[[:space:]]*\$" <<< "$lasts"; then
            echo "Review of $SHA passed."
          else
            echo "::error::No VERDICT line naming $SHA, so this review can't gate a merge. Re-run this job."; exit 1
          fi

  # Merges the PR once the review passed (or, for Dependabot, was skipped) and every other
  # check on the head commit finished green. Done in-workflow rather than with GitHub's auto-merge
  # because this waits on every check, not just the ruleset's required ones, and refuses if main
  # moved after combined-build. A merge made with GITHUB_TOKEN triggers no push workflows on the
  # default branch, so the job dispatches the deploy itself (workflow_dispatch is exempt). CodeQL
  # is GitHub's default setup, which scans PRs and runs weekly on its own.
  #
  # The checks ran on the PR as branched, but main may have moved since: two PRs that each
  # pass alone can break the build together. combined-build rebases the PR onto current main,
  # as the merge will, and builds that. It runs the PR's code, so it gets a read-only token and
  # its own job: nothing it does (env vars, $GITHUB_ENV writes) can reach the merge job's token.
  #
  # A Dependabot PR skips the review, so both jobs merge it on green checks alone (its action
  # pin bumps to this file included: Dependabot only rewrites `uses:` versions). They also
  # require Dependabot to have triggered the run (github.actor keeps the original actor on a
  # re-run): if anyone else pushes to its branch, the PR waits for a hand merge. !cancelled()
  # replaces the implicit success() that would skip both jobs behind a skipped review.
  combined-build:
    needs: claude-review
    if: >-
      github.event.pull_request.draft == false && !cancelled() && (
        (github.event.pull_request.user.login == github.repository_owner &&
         needs.claude-review.result == 'success') ||
        (github.event.pull_request.user.login == 'dependabot[bot]' &&
         github.actor == 'dependabot[bot]' && needs.claude-review.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      main-sha: ${{ steps.rebase.outputs.main-sha }}
    env:
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      # Assumes a same-repo PR branch without merge commits, which is how this repo works:
      # a fork's commit isn't on origin, and merge commits don't replay the way GitHub's
      # rebase merge does. Either case fails here, which blocks the merge.
      - name: Rebase the PR onto current main
        id: rebase
        run: |
          echo "main-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git fetch origin "$SHA"
          git -c user.name=automerge -c user.email=automerge@localhost \
            rebase --onto HEAD "$(git merge-base HEAD "$SHA")" "$SHA" || {
            echo "::error::The PR doesn't rebase cleanly onto current main. Rebase it and push."
            exit 1
          }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No dependency cache: PR code runs in this job and could poison a shared cache entry.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build the PR on top of current main
        run: |
          pnpm install --frozen-lockfile
          pnpm build || {
            echo "::error::The PR builds alone but not on top of current main. Rebase and fix it."
            exit 1
          }

  automerge:
    needs: [claude-review, combined-build]
    if: >-
      github.event.pull_request.draft == false && !cancelled() &&
      needs.combined-build.result == 'success' && (
        (github.event.pull_request.user.login == github.repository_owner &&
         needs.claude-review.result == 'success') ||
        (github.event.pull_request.user.login == 'dependabot[bot]' &&
         github.actor == 'dependabot[bot]' && needs.claude-review.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      actions: write
      contents: write
      pull-requests: write
      checks: read
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Wait for the other checks
        run: |
          # Three views of the head commit, all of which must be settled and green:
          #  - workflow runs, the latest per workflow other than this one. A run exists as soon
          #    as its workflow is triggered, before any of its jobs, so a CI job that hasn't been
          #    created yet still holds the merge; a red job anywhere makes its run red.
          #  - check runs from every app (CodeQL, GitGuardian...), the latest per app and name,
          #    so a check cancelled and redone on the same commit doesn't block. This workflow's
          #    own jobs are left out: `needs` already gates on them.
          #  - legacy commit statuses (with none, the combined state reads "pending").
          # Every pull_request workflow is triggered by the same event, so their runs appear
          # together; the 30 s head start and the rule that something besides this workflow must
          # be listed keep a Dependabot PR from merging on an empty list before they do.
          # pipefail: a failed gh call must end the job, not read as an empty, passing view.
          set -o pipefail
          own=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .workflow_id)
          sleep 30
          for _ in $(seq 80); do
            wf=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" --paginate --slurp | jq -r --argjson own "$own" '
              [.[].workflow_runs[] | select(.workflow_id != $own)] | group_by(.workflow_id) | map(max_by(.id))
              | .[] | "\(.status) \(.conclusion) workflow \(.name)"')
            checks=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" --paginate --slurp | jq -r '
              [.[].check_runs[] | select(.name != "automerge" and .name != "claude-review" and .name != "combined-build")]
              | group_by([.app.id, .name]) | map(max_by(.id))
              | .[] | "\(.status) \(.conclusion) check \(.name)"')
            status=$(gh api "repos/$REPO/commits/$SHA/status" --jq 'if .total_count == 0 then "none" else .state end')
            all=$(printf '%s\n%s\n' "$wf" "$checks" | grep . || true)
            if [ -n "$all" ] && ! grep -qv '^completed ' <<< "$all" && [ "$status" != pending ]; then
              bad=$(grep -vE '^completed (success|skipped|neutral) ' <<< "$all" || true)
              case "$status" in failure|error) bad="$bad${bad:+$'\n'}commit status: $status" ;; esac
              if [ -n "$bad" ]; then
                echo "::error::Not merging; these did not pass:"; echo "$bad"; exit 1
              fi
              echo "All checks passed:"; echo "$all"; exit 0
            fi
            sleep 30
          done
          echo "::error::Checks still running (or none besides this workflow) after 40 minutes; merge by hand or re-run this job."
          exit 1
      - name: Merge
        # --match-head-commit refuses if anything was pushed after the reviewed commit, and
        # the main check refuses if another merge landed after combined-build built on main.
        # The job's `if` read draft when the run started, and the wait above can take 40 minutes.
        # The branch is deleted through the API: this job has no checkout for gh's
        # --delete-branch to work in.
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MAIN_SHA: ${{ needs.combined-build.outputs.main-sha }}
        run: |
          draft=$(gh pr view "$PR" --repo "$REPO" --json isDraft --jq .isDraft)
          if [ "$draft" != false ]; then
            echo "::error::Not merging; the PR's draft state reads '$draft'. Mark it ready to start a new run."
            exit 1
          fi
          now=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
          if [ "$now" != "$MAIN_SHA" ]; then
            echo "::error::main moved during the combined build; re-run this job to test it."
            exit 1
          fi
          gh pr merge "$PR" --repo "$REPO" --rebase --match-head-commit "$SHA"
          gh api -X DELETE "repos/$REPO/git/refs/heads/$HEAD_REF" ||
            echo "::warning::Merged, but deleting branch $HEAD_REF failed."
      - name: Deploy main
        # The merge's push to main starts nothing (see above), so without this the
        # merged change never reaches the live site.
        run: gh workflow run deploy.yml --repo "$REPO" --ref main
